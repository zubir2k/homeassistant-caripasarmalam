<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Malaysian Night Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Canopy Stripes Gradients -->
    <linearGradient id="tealStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="amberStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#skyGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Night Sky Stars & Crescent Moon -->
  <path d="M 372 96 A 38 38 0 1 0 412 148 A 42 42 0 1 1 372 96 Z" fill="#fde047" opacity="0.92"/>
  <!-- Stars -->
  <circle cx="120" cy="110" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="160" cy="85" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="310" cy="100" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="430" cy="190" r="2" fill="#ffffff" opacity="0.5"/>

  <!-- Stall Ambient Glow -->
  <circle cx="256" cy="300" r="160" fill="url(#lampGlow)"/>

  <!-- Stall Structure Group -->
  <g filter="url(#shadow)">
    <!-- Poles -->
    <line x1="110" y1="240" x2="110" y2="400" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="402" y1="240" x2="402" y2="400" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <!-- Counter Table -->
    <rect x="88" y="360" width="336" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <rect x="100" y="370" width="312" height="12" rx="4" fill="#f59e0b" opacity="0.8"/>

    <!-- Steaming Basket / Food Skewers on counter -->
    <!-- Wok / Grill Plate -->
    <rect x="180" y="348" width="152" height="14" rx="4" fill="#475569"/>
    <!-- Satay skewers / food sticks -->
    <line x1="210" y1="334" x2="230" y2="350" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <line x1="230" y1="330" x2="245" y2="350" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <line x1="250" y1="332" x2="260" y2="350" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <line x1="270" y1="330" x2="275" y2="350" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <line x1="290" y1="334" x2="290" y2="350" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

    <!-- Hanging Market Lights (Festoon Lamps) -->
    <path d="M 110 240 Q 183 260 256 248 Q 329 260 402 240" fill="none" stroke="#64748b" stroke-width="3"/>
    <circle cx="180" cy="254" r="7" fill="#fde047"/>
    <circle cx="256" cy="250" r="8" fill="#fef08a"/>
    <circle cx="332" cy="254" r="7" fill="#fde047"/>

    <!-- Canopy Roof (Gerai Pasar Malam Awning) -->
    <!-- Triangular Peak Roof -->
    <path d="M 72 236 L 256 140 L 440 236 Z" fill="#0f766e"/>

    <!-- Canopy Stripe 1 (Amber) -->
    <path d="M 72 236 L 126 236 L 256 140 L 256 140 Z" fill="url(#amberStripe)"/>
    <!-- Canopy Stripe 2 (Teal) -->
    <path d="M 126 236 L 190 236 L 256 140 Z" fill="url(#tealStripe)"/>
    <!-- Canopy Stripe 3 (Amber - Center Left) -->
    <path d="M 190 236 L 256 236 L 256 140 Z" fill="url(#amberStripe)"/>
    <!-- Canopy Stripe 4 (Teal - Center Right) -->
    <path d="M 256 236 L 322 236 L 256 140 Z" fill="url(#tealStripe)"/>
    <!-- Canopy Stripe 5 (Amber) -->
    <path d="M 322 236 L 386 236 L 256 140 Z" fill="url(#amberStripe)"/>
    <!-- Canopy Stripe 6 (Teal) -->
    <path d="M 386 236 L 440 236 L 256 140 Z" fill="url(#tealStripe)"/>

    <!-- Scalloped Awning Valance (Frills) -->
    <path d="M 72 236 C 81 254 99 254 108 236 C 117 254 135 254 144 236 C 153 254 171 254 180 236 C 189 254 207 254 216 236 C 225 254 243 254 252 236 C 261 254 279 254 288 236 C 297 254 315 254 324 236 C 333 254 351 254 360 236 C 369 254 387 254 396 236 C 405 254 423 254 432 236 C 436 244 440 240 440 236" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- Location Map Pin at Canopy Peak (Cari GPS Marker) -->
  <g filter="url(#shadow)">
    <!-- Outer Pin Body -->
    <path d="M 256 82 C 234 82 216 100 216 122 C 216 150 256 186 256 186 C 256 186 296 150 296 122 C 296 100 278 82 256 82 Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="4"/>
    <!-- Inner Pin Dot -->
    <circle cx="256" cy="120" r="12" fill="#ffffff"/>
  </g>
</svg>
