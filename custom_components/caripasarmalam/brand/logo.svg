<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <linearGradient id="logoSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="logoTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="logoAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="logoPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (Scaled down version of icon) -->
  <g transform="translate(16, 16) scale(0.25)">
    <!-- Squircle Base -->
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#logoSky)"/>
    <rect x="0" y="0" width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
    <!-- Crescent Moon -->
    <path d="M 372 96 A 38 38 0 1 0 412 148 A 42 42 0 1 1 372 96 Z" fill="#fde047" opacity="0.9"/>
    <!-- Poles & Counter -->
    <line x1="110" y1="240" x2="110" y2="400" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
    <line x1="402" y1="240" x2="402" y2="400" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
    <rect x="88" y="360" width="336" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <rect x="100" y="370" width="312" height="12" rx="4" fill="#f59e0b" opacity="0.8"/>
    <!-- Canopy -->
    <path d="M 72 236 L 256 140 L 440 236 Z" fill="#0f766e"/>
    <path d="M 72 236 L 126 236 L 256 140 Z" fill="url(#logoAmber)"/>
    <path d="M 126 236 L 190 236 L 256 140 Z" fill="url(#logoTeal)"/>
    <path d="M 190 236 L 256 236 L 256 140 Z" fill="url(#logoAmber)"/>
    <path d="M 256 236 L 322 236 L 256 140 Z" fill="url(#logoTeal)"/>
    <path d="M 322 236 L 386 236 L 256 140 Z" fill="url(#logoAmber)"/>
    <path d="M 386 236 L 440 236 L 256 140 Z" fill="url(#logoTeal)"/>
    <!-- Valance -->
    <path d="M 72 236 C 81 254 99 254 108 236 C 117 254 135 254 144 236 C 153 254 171 254 180 236 C 189 254 207 254 216 236 C 225 254 243 254 252 236 C 261 254 279 254 288 236 C 297 254 315 254 324 236 C 333 254 351 254 360 236 C 369 254 387 254 396 236 C 405 254 423 254 432 236 C 436 244 440 240 440 236" fill="#f8fafc"/>
    <!-- Pin -->
    <path d="M 256 82 C 234 82 216 100 216 122 C 216 150 256 186 256 186 C 256 186 296 150 296 122 C 296 100 278 82 256 82 Z" fill="url(#logoPin)" stroke="#ffffff" stroke-width="4"/>
    <circle cx="256" cy="120" r="12" fill="#ffffff"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(168, 88)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.02em">
      <tspan fill="#0f172a">Cari</tspan><tspan fill="#00a29a">Pasar</tspan><tspan fill="#f59e0b">Malam</tspan>
    </text>
    <text y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" letter-spacing="0.08em">
      NIGHT MARKET TRACKER FOR HOME ASSISTANT
    </text>
  </g>
</svg>
