get_nearby:
  fields:
    entity_id:
      selector:
        entity:
          domain:
            - person
            - zone
    latitude:
      selector:
        number:
          min: -90
          max: 90
          step: any
    longitude:
      selector:
        number:
          min: -180
          max: 180
          step: any
    radius:
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: km
    limit:
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
